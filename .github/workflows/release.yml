name: Publish renderer image
on:
  push:
    tags: ['textgraph-renderer-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing textgraph-renderer-vX.Y.Z[-alpha.N] tag (select this tag as workflow ref)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: textgraph-renderer-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Resolve tagged source and validate registry lock
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/release.mjs resolve "$RELEASE_TAG"
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Build once from verified tagged source
        env:
          REVISION: ${{ steps.release.outputs.commit }}
          VERSION: ${{ steps.release.outputs.version }}
        run: docker build --platform linux/amd64 --build-arg REVISION="$REVISION" --build-arg VERSION="$VERSION" -t textgraph-renderer:release .
      - name: Verify the exact image to be published
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/smoke.mjs --image textgraph-renderer:release --expected-version "$VERSION"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image bytes and record registry digest
        run: node scripts/release.mjs publish textgraph-renderer:release
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-release
          path: |
            release-identity.json
            release-receipt.json
            smoke-receipt.json
          if-no-files-found: error
          retention-days: 90
