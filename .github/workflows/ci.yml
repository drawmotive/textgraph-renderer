name: Verify renderer
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Build local image
        run: docker build --platform linux/amd64 --build-arg REVISION="$GITHUB_SHA" -t textgraph-renderer:verified .
      - name: Exercise image as non-root with a read-only filesystem
        run: node scripts/smoke.mjs --image textgraph-renderer:verified
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-verification
          path: smoke-receipt.json
          if-no-files-found: ignore
