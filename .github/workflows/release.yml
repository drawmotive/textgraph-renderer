name: Publish renderer image
on:
  # Branch pushes belong to ci.yml; image publication requires a selected phase
  # and immutable version tag supplied by the release coordinator.
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable renderer version tag (select this tag as ref)
        required: true
        type: string
      phase:
        description: Prepare freezes a tested image; publish uploads those same bytes
        required: true
        type: choice
        options: [prepare, publish]
        default: prepare
      prepare_run:
        description: Exact successful prepare run ID
        type: string
      receipt_sha256:
        description: Reviewed retained-renderer.json SHA256
        type: string
permissions:
  contents: read
concurrency:
  group: textgraph-renderer-publication
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'prepare' && startsWith(github.ref, 'refs/tags/textgraph-renderer-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve source and registry lock
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release.mjs resolve "$RELEASE_TAG"
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Build and smoke test once
        env:
          VERSION_TAG: ${{ inputs.tag }}
        run: |
          VERSION="${VERSION_TAG#textgraph-renderer-v}"
          docker build --platform linux/amd64 --build-arg REVISION="$GITHUB_SHA" --build-arg VERSION="$VERSION" -t textgraph-renderer:release .
          node scripts/smoke.mjs --image textgraph-renderer:release --expected-version "$VERSION"
          node scripts/retained-release.mjs seal textgraph-renderer:release
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-candidate
          path: |
            renderer-image.tar
            retained-renderer.json
          if-no-files-found: error
          retention-days: 90
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'publish' && startsWith(github.ref, 'refs/tags/textgraph-renderer-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: renderer-candidate
          run-id: ${{ inputs.prepare_run }}
          github-token: ${{ github.token }}
      - name: Validate and load the reviewed image
        env:
          RECEIPT_SHA256: ${{ inputs.receipt_sha256 }}
          PREPARE_RUN: ${{ inputs.prepare_run }}
        run: node scripts/retained-release.mjs load
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested bytes and confirm anonymous access
        run: |
          IMAGE_ID="$(node -p "JSON.parse(require('fs').readFileSync('retained-renderer.json')).imageId")"
          node scripts/release.mjs publish "$IMAGE_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-release
          path: release-receipt.json
          if-no-files-found: error
          retention-days: 90
